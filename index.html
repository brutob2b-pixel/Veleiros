<style>
  html,body{margin:0;height:100%;background:#17120f}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  #up{position:fixed;top:20px;left:20px;z-index:5;display:flex;flex-direction:column;gap:12px;
      width:250px;padding:16px;border-radius:12px;background:rgba(12,9,8,.82);
      max-height:calc(100vh - 40px);overflow-y:auto;
      border:1px solid rgba(217,164,65,.35);backdrop-filter:blur(8px);
      font-family:"Barlow Condensed",system-ui,sans-serif;color:#f3e2c4}
  #toggleUp{display:none}
  @media (max-width:760px){
    #up{left:0;right:0;top:auto;bottom:0;width:auto;max-height:70vh;
        border-radius:16px 16px 0 0;padding-top:20px;transition:max-height .2s ease}
    #up.recolhido{max-height:54px;overflow:hidden}
    #toggleUp{display:block;position:absolute;top:9px;left:50%;transform:translateX(-50%);
              width:44px;height:5px;border-radius:3px;background:rgba(217,164,65,.55);cursor:pointer}
    three-d-stage{height:100vh}
  }
  #up h1{margin:0;font-family:Cinzel,serif;font-size:14px;letter-spacing:.12em;color:#e0b25c;font-weight:700}
  #up p{margin:0;font-size:13px;line-height:1.35;color:#bda98c}
  .drop{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:8px;cursor:pointer;
        border:1px dashed rgba(217,164,65,.5);background:rgba(176,17,24,.10);transition:.15s}
  .drop:hover,.drop.over{background:rgba(176,17,24,.28);border-color:#e0b25c}
  .drop b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#f6e8cc}
  .drop span{font-size:12px;color:#bda98c}
  .drop img{width:100%;height:62px;object-fit:cover;border-radius:5px;display:none}
  .drop.has img{display:block}
  #up button{all:unset;text-align:center;padding:8px;border-radius:7px;cursor:pointer;font-size:12px;
             letter-spacing:.1em;text-transform:uppercase;color:#bda98c;border:1px solid rgba(217,164,65,.3)}
  #up button:hover{color:#f6e8cc;border-color:#e0b25c}
  #up input{display:none}
  #up .dl{display:flex;gap:8px}
  #up .dl a{flex:1;text-align:center;padding:8px 4px;border-radius:7px;font-size:12px;letter-spacing:.08em;
            text-transform:uppercase;color:#e0b25c;text-decoration:none;border:1px solid rgba(217,164,65,.3)}
  #up .dl a:hover{color:#f6e8cc;border-color:#e0b25c;background:rgba(176,17,24,.2)}
  #up .marcas{display:flex;gap:6px;flex-wrap:wrap}
  #up .marcas .b{padding:5px 10px;border-radius:20px;font-size:11px;letter-spacing:.04em;
                 text-transform:uppercase;color:#bda98c;border:1px solid rgba(217,164,65,.28);cursor:pointer}
  #up .marcas .b.on{color:#0b0708;background:#e0b25c;border-color:#e0b25c}
  #up .lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #up .lib figure{margin:0;position:relative;border-radius:6px;overflow:hidden;cursor:pointer;
                  border:1px solid rgba(217,164,65,.28);background:#0b0708;aspect-ratio:1}
  #up .lib figure:hover{border-color:#e0b25c}
  #up .lib figure.ativo{border:2px solid #e0b25c;box-shadow:0 0 0 2px rgba(224,178,92,.35) inset}
  #up .lib img{width:100%;height:100%;object-fit:contain;display:block}
  #up .lib figcaption{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;font-size:10.5px;
                      line-height:1.2;letter-spacing:.02em;color:#f6e8cc;background:rgba(8,5,4,.82);
                      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #up .lib .act{position:absolute;top:2px;right:2px;display:flex;gap:2px;opacity:.82;transition:.12s}
  #up .lib figure:hover .act{opacity:1}
  #up .lib .act span{width:19px;height:19px;display:grid;place-items:center;border-radius:4px;
                     font-size:11px;color:#f6e8cc;background:rgba(8,5,4,.9)}
  #up .lib .act span:hover{background:#b01118}
  #up .lib .tag{position:absolute;top:2px;left:2px;padding:1px 4px;border-radius:4px;font-size:8px;
                letter-spacing:.08em;color:#0b0708;background:#e0b25c}
  #up .lib .check{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
                  background:#e0b25c;color:#0b0708;display:grid;place-items:center;font-size:10px;font-weight:700}
  #up .vazio{font-size:12px;color:#8d7f6c;font-style:italic}
  #up hr{border:none;border-top:1px solid rgba(217,164,65,.22);margin:2px 0}
  /* celular: biblioteca primeiro, em faixa deslizável — recolhido mostra
     título + filtro de marca + kits, para trocar de kit vendo o pote */
  @media (max-width:760px){
    #up.recolhido{max-height:178px}
    #tituloLib{order:-4} #marcasBar{order:-3} #lib{order:-2} #vazioLib{order:-1}
    #up .lib{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;padding-bottom:2px}
    #up .lib::-webkit-scrollbar{display:none}
    #up .lib figure{flex:0 0 76px}
    #up .marcas{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}
    #up .marcas::-webkit-scrollbar{display:none}
    #up .marcas .b{white-space:nowrap}
  }
</style>
</head>

<script type="application/json" id="bibliotecaEmbutida">{"artes":[]}</script>
<three-d-stage name="pote-veleiros-do-caribe" background="#1d1714" autorotate></three-d-stage>
<div id="up">
  <div id="toggleUp" title="Mostrar/ocultar painel"></div>
  <h1>SUA ARTE</h1>
  <p>Suba as duas artes para substituir os rótulos do mockup.</p>
  <label class="drop" id="dropTop">
    <b>Tampa</b><span>disco completo (1:1)</span>
    <img id="prevTop" alt="">
    <input type="file" id="fileTop" accept="image/*">
  </label>
  <label class="drop" id="dropWrap">
    <b>Corpo · wrap 360°</b>    <span>faixa deitada · 280 × 15 mm. A arte é encaixada preservando a proporção original (nunca esticada).</span>
    <img id="prevWrap" alt="">
    <input type="file" id="fileWrap" accept="image/*">
  </label>
  <button id="girar">▶ Girar</button>
  <button id="abrirTampa">⇧ Abrir tampa</button>
  <button id="gravarVideo">🎬 Gravar vídeo (abertura)</button>
  <button id="pdf">Salvar PDF (4 cenários)</button>
  <button id="reset">Voltar ao original</button>
  <p id="aviso" style="color:#e0b25c"></p>
  <hr>
  <h1 id="tituloLib">BIBLIOTECA DE ARTES</h1>
  <p id="ajudaLib">Artes da pasta <b>artes/</b> do servidor aparecem sozinhas. Arraste PNGs aqui para testar localmente.</p>
  <label class="drop" id="dropLib">
    <b>+ Adicionar artes</b><span>PNG/JPG · vários de uma vez</span>
    <input type="file" id="fileLib" accept="image/*" multiple>
  </label>
  <div class="marcas" id="marcasBar" style="display:none"></div>
  <div class="lib" id="lib"></div>
  <p class="vazio" id="vazioLib">Nenhuma arte na biblioteca.</p>
  <button id="exportar">Exportar HTML para o cliente</button>
  <hr>
  <p>Gabaritos em mm com corte, sangria e área segura — abra no Illustrator.</p>
  <div class="dl">
    <a href="#" id="dlTampa">Tampa</a>
    <a href="#" id="dlCorpo">Corpo</a>
  </div>

<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
await (document.fonts ? document.fonts.ready : Promise.resolve());

const GOLD = '#d9a441', GOLD_HI = '#f6e3a1', RED = '#b01118', RED_DK = '#460508';

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function tex(canvas, repeatX) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = (stage._renderer && stage._renderer.capabilities.getMaxAnisotropy()) || 16;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  if (repeatX) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = repeatX; }
  return t;
}
function goldFill(ctx, x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#8c5a1c'); g.addColorStop(.35, GOLD_HI);
  g.addColorStop(.55, GOLD); g.addColorStop(.8, '#9c6a22'); g.addColorStop(1, GOLD_HI);
  return g;
}
function ring(ctx, cx, cy, r, w) {
  ctx.lineWidth = w;
  ctx.strokeStyle = goldFill(ctx, cx - r, cy - r, cx + r, cy + r);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
}
function palm(ctx, x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(-3, 0); ctx.quadraticCurveTo(2, -60, 14, -104);
  ctx.lineTo(20, -104); ctx.quadraticCurveTo(8, -58, 5, 0); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI + i * (Math.PI / 6.2);
    ctx.beginPath(); ctx.moveTo(16, -104);
    ctx.quadraticCurveTo(16 + Math.cos(a) * 34, -104 + Math.sin(a) * 30 - 14,
                         16 + Math.cos(a) * 62, -104 + Math.sin(a) * 40 + 8);
    ctx.quadraticCurveTo(16 + Math.cos(a) * 32, -104 + Math.sin(a) * 26 + 4, 16, -100);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function compass(ctx, cx, cy, r) {
  ctx.save();
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  bg.addColorStop(0, '#2a0407'); bg.addColorStop(1, '#140203');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ring(ctx, cx, cy, r * .97, r * .07);
  ring(ctx, cx, cy, r * .62, r * .035);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, len = i % 2 ? r * .42 : r * .86;
    ctx.fillStyle = goldFill(ctx, cx - r, cy - r, cx + r, cy + r);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
    ctx.lineTo(cx + Math.cos(a + .34) * r * .17, cy + Math.sin(a + .34) * r * .17);
    ctx.lineTo(cx + Math.cos(a - .34) * r * .17, cy + Math.sin(a - .34) * r * .17);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = GOLD_HI;
  ctx.font = `700 ${r * .3}px Cinzel, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [['N', 0, -r * .78], ['S', 0, r * .78], ['L', r * .78, 0], ['O', -r * .78, 0]]
    .forEach(([t, dx, dy]) => ctx.fillText(t, cx + dx, cy + dy));
  ctx.restore();
}
function ship(ctx, cx, base, s) {
  ctx.save(); ctx.translate(cx, base); ctx.scale(s, s);
  ctx.fillStyle = '#1b0204';
  ctx.beginPath(); ctx.moveTo(-96, 0); ctx.quadraticCurveTo(0, 40, 96, 0);
  ctx.lineTo(74, -26); ctx.lineTo(-78, -26); ctx.closePath(); ctx.fill();
  ctx.fillRect(-3, -230, 6, 205);
  ctx.fillRect(-62, -180, 5, 155); ctx.fillRect(58, -168, 5, 143);
  const sail = (x, y, w, h, lean) => {
    const g = ctx.createLinearGradient(x - w, y, x + w, y + h);
    g.addColorStop(0, '#7c0a11'); g.addColorStop(.5, '#d2252c'); g.addColorStop(1, '#61070d');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - w, y); ctx.lineTo(x + w, y);
    ctx.quadraticCurveTo(x + w + lean, y + h * .6, x + w * .5, y + h);
    ctx.lineTo(x - w * .8, y + h); ctx.quadraticCurveTo(x - w - lean, y + h * .5, x - w, y);
    ctx.closePath(); ctx.fill();
  };
  sail(0, -218, 34, 70, 14); sail(0, -142, 46, 78, 18); sail(0, -58, 40, 32, 10);
  sail(-60, -172, 26, 60, 10); sail(58, -160, 24, 56, 10);
  ctx.restore();
}
function seaSky(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#3d0509'); g.addColorStop(.42, '#a7121a');
  g.addColorStop(.52, '#d8242c'); g.addColorStop(.56, '#6e0a10');
  g.addColorStop(1, '#210305');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const sun = ctx.createRadialGradient(w * .27, h * .3, 0, w * .27, h * .3, h * .22);
  sun.addColorStop(0, 'rgba(255,236,198,.95)'); sun.addColorStop(.5, 'rgba(255,160,120,.25)');
  sun.addColorStop(1, 'rgba(255,120,90,0)');
  ctx.fillStyle = sun; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  for (let i = 0; i < 60; i++) {
    const y = h * .56 + Math.random() * h * .42;
    ctx.fillRect(Math.random() * w, y, 30 + Math.random() * 90, 1.5);
  }
}

/* ---------- rótulos em branco (base do mockup) ---------- */
const [topC, tc] = cv(1400, 1400);
(() => {
  const S = 1400, cx = S / 2;
  tc.fillStyle = '#0b0708'; tc.fillRect(0, 0, S, S);
  tc.save();
  tc.beginPath(); tc.arc(cx, cx, S * .455, 0, 7); tc.clip();
  tc.fillStyle = '#f6f3ee'; tc.fillRect(0, 0, S, S);
  tc.restore();
})();

const [wrapC, wc] = cv(4096, 219);
(() => {
  wc.fillStyle = '#f6f3ee'; wc.fillRect(0, 0, 4096, 219);
})();

/* ---------- materiais ---------- */
const plastic = new THREE.MeshStandardMaterial({ name: 'plastico_preto', color: 0x141314, roughness: .28, metalness: .18 });
const plasticSide = new THREE.MeshStandardMaterial({ name: 'plastico_preto_fosco', color: 0x0f0e0f, roughness: .5, metalness: .1 });
const gold = new THREE.MeshStandardMaterial({ name: 'dourado', color: 0xe0b25c, roughness: .3, metalness: .38 });
// textura da pasta: leve redemoinho (como se tivesse sido colhida com uma
// espátula) + brilho de clearcoat, pra vender "consistência cremosa"
// em vez de um disco liso — é revelado pela animação de abrir a tampa.
const [pasteC, pctx] = cv(512, 512);
(() => {
  const S = 512, cx = S / 2;
  const base = '#f3dfe2';
  pctx.fillStyle = base; pctx.fillRect(0, 0, S, S);
  const grad = pctx.createRadialGradient(cx * .92, cx * .85, S * .05, cx, cx, S * .62);
  grad.addColorStop(0, 'rgba(255,255,255,.55)');
  grad.addColorStop(.4, 'rgba(255,255,255,.12)');
  grad.addColorStop(1, 'rgba(0,0,0,.06)');
  pctx.fillStyle = grad; pctx.fillRect(0, 0, S, S);
  pctx.strokeStyle = 'rgba(0,0,0,.05)'; pctx.lineWidth = 2.5;
  for (let r = S * .08; r < S * .5; r += S * .045) {
    pctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.4; a += 0.06) {
      const rr = r + Math.sin(a * 3 + r) * S * .012;
      const x = cx + Math.cos(a + r * .01) * rr, y = cx + Math.sin(a + r * .01) * rr;
      a === 0 ? pctx.moveTo(x, y) : pctx.lineTo(x, y);
    }
    pctx.stroke();
  }
})();
const paste = new THREE.MeshPhysicalMaterial({
  name: 'pasta_morango', map: tex(pasteC), roughness: .42, metalness: 0,
  clearcoat: .35, clearcoatRoughness: .2
});
const labelTop = new THREE.MeshStandardMaterial({ name: 'rotulo_tampa', map: tex(topC), roughness: .22, metalness: .12 });
const labelWrap = new THREE.MeshStandardMaterial({ name: 'rotulo_corpo', map: tex(wrapC), roughness: .26, metalness: .12 });

/* ---------- geometria: pote Ø85 × 38 mm ---------- */
const R = 0.04406, LID_R = 0.0453, BODY_H = 0.020, LID_H = 0.020, OVER = 0.002;
const TOP_Y = BODY_H + LID_H - OVER;
const BAND_H = 0.015;
const jar = new THREE.Group(); jar.name = 'pote_pasta_modeladora';
const add = (name, geo, mat, y, rx, ry, rz) => {
  const m = new THREE.Mesh(geo, mat);
  m.name = name; m.position.y = y;
  m.rotation.set(rx || 0, ry || 0, rz || 0);
  jar.add(m); return m;
};

// corpo
// aberto (sem tampas próprias): um cilindro "fechado" (openEnded=false)
// tem um disco opaco no topo, que tapava a visão da pasta por baixo mesmo
// com a tampa aberta — abrimos o topo e o fundo e recriamos só o fundo
// como peça separada, senão o pote fica sem chão visto de baixo.
// corpo e fundo visíveis dos dois lados: o fundo precisa aparecer visto de baixo
// (antes era um disco só com a face de cima, e o pote parecia sem base) e a
// parede interna precisa aparecer com a tampa aberta, olhando para dentro.
const plasticSide2 = plasticSide.clone(); plasticSide2.side = THREE.DoubleSide;
add('corpo', new THREE.CylinderGeometry(R, R * .97, BODY_H, 96, 1, true), plasticSide2, BODY_H / 2);
add('fundo_pote', new THREE.CircleGeometry(R * .97, 96), plasticSide2, 0.0002, Math.PI / 2);
add('rotulo_corpo', new THREE.CylinderGeometry(0.044563, 0.044563, BAND_H, 96, 1, true), labelWrap, BODY_H / 2 - .0005, 0, -1.42);
add('pasta', new THREE.CylinderGeometry(R - .0025, R - .0025, .0005, 64), paste, BODY_H - .0016);
add('base_pe', new THREE.TorusGeometry(R * .94, .0014, 14, 96), plastic, .0014, Math.PI / 2);

// tampa
add('tampa_lateral', new THREE.CylinderGeometry(LID_R, LID_R, LID_H, 96, 1, true), plasticSide, BODY_H + LID_H / 2 - OVER);
add('tampa_topo', new THREE.CylinderGeometry(LID_R, LID_R, .0035, 96), plastic, TOP_Y - .0018);
add('rotulo_tampa', new THREE.CircleGeometry(0.04455, 96), labelTop, TOP_Y + .0002, -Math.PI / 2, 0, 0.675);
add('aro_base_tampa', new THREE.TorusGeometry(LID_R - .0012, .0012, 14, 128), plastic, BODY_H - OVER + .0004, Math.PI / 2);

/* ---------- agrupa a tampa (peça única, gira em torno do próprio centro) ---------- */
// pivô no centro vertical da tampa: assim inclinar o grupo tomba a tampa
// "na mão", em vez de girar em torno da base do pote.
const LID_PIVOT_Y = BODY_H + LID_H / 2 - OVER;
const tampaGroup = new THREE.Group();
tampaGroup.name = 'tampa';
tampaGroup.position.y = LID_PIVOT_Y;
['tampa_lateral', 'tampa_topo', 'rotulo_tampa', 'aro_base_tampa'].forEach(n => {
  const m = jar.getObjectByName(n);
  jar.remove(m);
  m.position.y -= LID_PIVOT_Y;
  tampaGroup.add(m);
});
jar.add(tampaGroup);

jar.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.setObject(jar);

/* ---------- animação: abrir/fechar a tampa ---------- */
// tudo aqui força um render manual a cada frame do tween — o loop do
// stage só redesenha sob demanda, então uma animação externa como esta
// tem que avisar (stage.requestRender()) ou fica "congelada" na tela.
const LID_CLOSED = { y: LID_PIVOT_Y, x: 0, z: 0, rz: 0, rx: 0 };
const LID_OPEN = { y: LID_PIVOT_Y + 0.05, x: 0.034, z: 0.006, rz: -0.62, rx: 0.16 };
let lidState = 'closed'; // 'closed' | 'open' | 'animating'
let lidTween = null;
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tweenTampa(to, duration, onDone) {
  if (lidTween) cancelAnimationFrame(lidTween.raf);
  const from = {
    y: tampaGroup.position.y, x: tampaGroup.position.x, z: tampaGroup.position.z,
    rz: tampaGroup.rotation.z, rx: tampaGroup.rotation.x
  };
  const t0 = performance.now();
  lidTween = { raf: 0 };
  const step = now => {
    const t = Math.min(1, (now - t0) / duration);
    const k = easeInOutCubic(t);
    tampaGroup.position.set(from.x + (to.x - from.x) * k, from.y + (to.y - from.y) * k, from.z + (to.z - from.z) * k);
    tampaGroup.rotation.z = from.rz + (to.rz - from.rz) * k;
    tampaGroup.rotation.x = from.rx + (to.rx - from.rx) * k;
    stage.requestRender();
    if (t < 1) { lidTween.raf = requestAnimationFrame(step); }
    else { lidTween = null; if (onDone) onDone(); }
  };
  lidTween.raf = requestAnimationFrame(step);
}
// a tampa levantada e inclinada fica entre a luz principal e a pasta —
// se continuar projetando sombra, a pasta que a animação deveria mostrar
// escurece na hora exata em que devia aparecer. Sem sombra da tampa
// durante a abertura; volta a projetar sombra (o filete embaixo da borda)
// só quando fechada de novo.
function setTampaCastShadow(v) {
  tampaGroup.traverse(o => { if (o.isMesh) o.castShadow = v; });
}
function abrirTampaFn(duration) {
  return new Promise(resolve => {
    lidState = 'animating';
    setTampaCastShadow(false);
    tweenTampa(LID_OPEN, duration != null ? duration : 900, () => { lidState = 'open'; resolve(); });
  });
}
function fecharTampaFn(duration) {
  return new Promise(resolve => {
    lidState = 'animating';
    tweenTampa(LID_CLOSED, duration != null ? duration : 900, () => {
      lidState = 'closed'; setTampaCastShadow(true); stage.requestRender(); resolve();
    });

  }
});

/* ---------- gravar a abertura como vídeo (.webm ou .mp4, o que o navegador suportar) ---------- */
function escolherMimeType() {
  const opcoes = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const t of opcoes) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}
gravarVideo.addEventListener('click', async () => {
  if (lidState === 'animating' || gravarVideo.disabled) return;
  if (!window.MediaRecorder || !stage._renderer.domElement.captureStream) {
    aviso.textContent = 'Este navegador não suporta gravação de vídeo direto da tela (captureStream/MediaRecorder).';
    return;
  }
  const oldAutoRotate = stage._controls.autoRotate;
  stage._controls.autoRotate = false;
  // canvas.captureStream() só grava os pixels do canvas — o fundo que
  // aparece no app é um CSS atrás do canvas (que é transparente, alpha:true),
  // então sem isto o vídeo sai com fundo preto. Mesmo truque do export de PDF.
  const oldBG = stage._scene.background;
  const bgAttr = stage.getAttribute('background');
  if (bgAttr) stage._scene.background = new THREE.Color(bgAttr);
  stage.requestRender();
  abrirTampa.disabled = true;
  gravarVideo.disabled = true;
  const textoOriginal = gravarVideo.textContent;
  gravarVideo.textContent = 'Gravando…';
  try {
    if (lidState !== 'closed') { await fecharTampaFn(400); }
    const mime = escolherMimeType();
    const stream = stage._renderer.domElement.captureStream(30);
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const gravado = new Promise(resolve => { rec.onstop = resolve; });
    rec.start();
    await new Promise(r => setTimeout(r, 200)); // um respiro antes de animar, pra não cortar o 1º frame
    await abrirTampaFn(1400);
    await new Promise(r => setTimeout(r, 1200)); // segura a tampa aberta um instante, pra dar tempo de ver a pasta
    rec.stop();
    await gravado;
    const blob = new Blob(chunks, { type: mime ? mime.split(';')[0] : 'video/webm' });
    const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'pote-abrindo-tampa.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    if (ext === 'webm') {
      aviso.textContent = 'Vídeo baixado em .webm (seu navegador não grava .mp4 direto). Pra usar em Instagram/WhatsApp, converta em cloudconvert.com ou similar — é gratuito e rápido.';
    } else {
      aviso.textContent = '';
    }
  } catch (e) {
    aviso.textContent = 'Falha ao gravar o vídeo: ' + e.message;
  }
  stage._scene.background = oldBG;
  stage.requestRender();
  gravarVideo.textContent = textoOriginal;
  abrirTampa.disabled = false;
  gravarVideo.disabled = false;
  abrirTampa.textContent = lidState === 'open' ? '⇩ Fechar tampa' : '⇧ Abrir tampa';
  stage._controls.autoRotate = oldAutoRotate;
});

/* ---------- upload das artes do usuário ---------- */
const KEY = 'veleiros-labels';
// proporção real de cada rótulo: a arte é encaixada dentro (contain), nunca esticada
const MAXTEX = Math.min(8192, (stage._renderer && stage._renderer.capabilities.maxTextureSize) || 4096);
const FIT = { top: [Math.min(2048, MAXTEX), Math.min(2048, MAXTEX)], wrap: [MAXTEX, Math.round(MAXTEX * 15 / 280)] };
const slots = {
  top: { mat: labelTop, base: labelTop.map, prev: prevTop, drop: dropTop, input: fileTop, repeat: 0 },
  wrap: { mat: labelWrap, base: labelWrap.map, prev: prevWrap, drop: dropWrap, input: fileWrap, repeat: 0 }
};
const store = JSON.parse(localStorage.getItem(KEY) || '{}');

// modo de encaixe da tarja: sempre "encaixar" (nunca esticar/distorcer a arte)
const mode = 'contain';
function applyArt(which, dataURL) {
  const s = slots[which];
  const img = new Image();
  img.onload = () => {
    const [W, H] = FIT[which];
    const [c, x] = cv(W, H);
    x.fillStyle = '#0b0708'; x.fillRect(0, 0, W, H);
    const k = Math.min(W / img.width, H / img.height);
    const w = img.width * k, ht = img.height * k;
    x.drawImage(img, (W - w) / 2, (H - ht) / 2, w, ht);
    const t = tex(c, which === 'wrap' ? 1 : 0);
    if (which === 'wrap') t.wrapS = THREE.RepeatWrapping;
    s.mat.map = t; s.mat.needsUpdate = true;
    stage.requestRender();
  };
  img.src = dataURL;
  s.prev.src = dataURL; s.drop.classList.add('has');
}
function readFile(which, file) {
  if (!file || !file.type.startsWith('image/')) return;
  const fr = new FileReader();
  fr.onload = () => {
    applyArt(which, fr.result);
    // guarda uma versão reduzida (máx. 3072 px) para caber na cota do navegador
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, (which === 'wrap' ? 8192 : 2048) / im.width);
      const [c, x] = cv(Math.round(im.width * k), Math.round(im.height * k));
      x.drawImage(im, 0, 0, c.width, c.height);
      store[which] = c.toDataURL('image/jpeg', 0.95);
      try {
        localStorage.setItem(KEY, JSON.stringify(store));
        aviso.textContent = '';
      } catch (e) {
        aviso.textContent = 'Arte muito grande para salvar — vale só nesta sessão.';
      }
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
Object.entries(slots).forEach(([which, s]) => {

  ['dragenter', 'dragover'].forEach(ev => s.drop.addEventListener(ev, e => {

  }));
  ['dragleave', 'drop'].forEach(ev => s.drop.addEventListener(ev, e => {
    e.preventDefault(); s.drop.classList.remove('over');
  }));
  s.drop.addEventListener('drop', e => readFile(which, e.dataTransfer.files[0]));
  if (store[which]) applyArt(which, store[which]);
});
/* ---------- export PDF: 4 cenários em alta resolução ---------- */
const CENAS = [
  { nome: '3/4 frontal',   dir: [ 0.62,  0.42,  0.95] },
  { nome: 'frente',        dir: [ 0.00,  0.16,  1.00] },
  { nome: 'topo',          dir: [ 0.00,  0.80,  0.55] },
  { nome: '3/4 posterior', dir: [-0.78,  0.30, -0.82] }
];
const PX = [3300, 2160]; // ~300 dpi, proporção da área útil do A4 paisagem

let _verts = null;
function vertices() {
  if (_verts) return _verts;
  const out = [], v = new THREE.Vector3();
  stage._object.updateMatrixWorld(true);
  stage._object.traverse(o => {
    if (!o.isMesh) return;
    const p = o.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
      out.push(v.x, v.y, v.z);
    }
  });
  _verts = out;
  return out;
}

function renderCena(dir, roll) {
  const r = stage._renderer, cam = stage._camera, ctr = stage._controls;
  const oldTarget = ctr.target.clone();
  const size = new THREE.Vector2(); r.getSize(size);
  const oldPos = cam.position.clone(), oldAsp = cam.aspect, oldRot = ctr.autoRotate;
  const oldDPR = r.getPixelRatio();
  r.setPixelRatio(1);
  ctr.autoRotate = false;
  const oldBG = stage._scene.background;
  stage._scene.background = new THREE.Color('#1d1714');
  // enquadramento pela silhueta real: vértices da geometria em coordenadas de mundo
  const box = new THREE.Box3().setFromObject(stage._object);
  const ctro = box.getCenter(new THREE.Vector3());
  const pts = vertices();
  const fov = cam.fov * Math.PI / 180;
  const tanV = Math.tan(fov / 2);
  const tanH = tanV * (PX[0] / PX[1]);
  const n = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
  const up0 = Math.abs(n.y) > 0.95 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(up0, n).normalize();
  const up = new THREE.Vector3().crossVectors(n, right).normalize();
  if (roll) { right.applyAxisAngle(n, roll).normalize(); up.applyAxisAngle(n, roll).normalize(); }
  let dist = 0;
  const c = new THREE.Vector3();
  for (let i = 0; i < pts.length; i += 3) {
    c.set(pts[i], pts[i + 1], pts[i + 2]).sub(ctro);
    const d = c.dot(n);
    dist = Math.max(dist, Math.abs(c.dot(right)) / tanH + d, Math.abs(c.dot(up)) / tanV + d);
  }
  dist *= 1.06;
  ctr.target.copy(ctro);
  const v = n.clone().multiplyScalar(dist);
  cam.position.copy(ctr.target).add(v);
  cam.up.copy(up);
  cam.lookAt(ctr.target);
  cam.aspect = PX[0] / PX[1];
  cam.updateProjectionMatrix();
  r.setSize(PX[0], PX[1], false);
  r.render(stage._scene, cam);
  const data = r.domElement.toDataURL('image/jpeg', 0.94);
  const dim = [r.domElement.width, r.domElement.height];
  cam.position.copy(oldPos); cam.aspect = oldAsp; cam.up.set(0, 1, 0); cam.updateProjectionMatrix();
  cam.lookAt(oldTarget);
  stage._scene.background = oldBG;
  r.setPixelRatio(oldDPR);
  r.setSize(size.x, size.y, false);
  ctr.target.copy(oldTarget);
  ctr.autoRotate = oldRot;
  stage.requestRender();
  return { data: data, dim: dim };
}

// gerador de PDF mínimo: páginas A4 paisagem com JPEG embutido
function montarPDF(imagens, dims, legendas) {
  const W = 842, H = 595, enc = new TextEncoder();
  const partes = [], offsets = [];
  let out = [], len = 0;
  const push = (bytes) => { out.push(bytes); len += bytes.length; };
  const pushStr = (s) => push(enc.encode(s));
  pushStr('%PDF-1.4\n');
  const objs = [];
  const addObj = (body, raw) => {
    offsets.push(len);
    pushStr((objs.length + 1) + ' 0 obj\n');
    pushStr(body);
    if (raw) { push(raw); pushStr('\nendstream\n'); }
    pushStr('endobj\n');
    objs.push(1);
    return objs.length;
  };
  const n = imagens.length;
  const kids = [];
  const pagesId = 1 + 0; // reservado: montamos depois via placeholders
  // objetos: 1 = Catalog, 2 = Pages, depois por página: Page, Content, Image; fonte no final
  const pageIds = [], contentIds = [], imgIds = [];
  for (let i = 0; i < n; i++) { pageIds.push(3 + i * 3); contentIds.push(4 + i * 3); imgIds.push(5 + i * 3); }
  const fontId = 3 + n * 3;
  addObj('<< /Type /Catalog /Pages 2 0 R >>\n');
  addObj('<< /Type /Pages /Count ' + n + ' /Kids [' + pageIds.map(i => i + ' 0 R').join(' ') + '] >>\n');
  for (let i = 0; i < n; i++) {
    const m = 28, iw = W - m * 2, ih = ((H - m * 2 - 26) );
    const [pw, ph] = dims[i];
    const scale = Math.min(iw / pw, ih / ph);
    const dw = pw * scale, dh = ph * scale;
    const dx = (W - dw) / 2, dy = H - m - dh;
    const stream = 'q ' + dw.toFixed(2) + ' 0 0 ' + dh.toFixed(2) + ' ' + dx.toFixed(2) + ' ' + dy.toFixed(2) +
      ' cm /Im0 Do Q\nBT /F1 11 Tf ' + dx.toFixed(2) + ' ' + (dy - 18).toFixed(2) + ' Td (' +
      legendas[i].replace(/[^\x20-\x7e]/g, '-').replace(/[()\\]/g, '') + ') Tj ET\n';
    addObj('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 ' +
      imgIds[i] + ' 0 R >> /Font << /F1 ' + fontId + ' 0 R >> >> /Contents ' + contentIds[i] + ' 0 R >>\n');
    addObj('<< /Length ' + enc.encode(stream).length + ' >>\nstream\n', enc.encode(stream));
    const bin = imagens[i];
    addObj('<< /Type /XObject /Subtype /Image /Width ' + pw + ' /Height ' + ph +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bin.length + ' >>\nstream\n', bin);
  }
  addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\n');
  const xref = len;
  pushStr('xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n');
  offsets.forEach(o => pushStr(String(o).padStart(10, '0') + ' 00000 n \n'));
  pushStr('trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  let total = 0; out.forEach(b => total += b.length);
  const buf = new Uint8Array(total); let p = 0;
  out.forEach(b => { buf.set(b, p); p += b.length; });
  return new Blob([buf], { type: 'application/pdf' });
}

function dataURLtoBytes(u) {
  const bin = atob(u.split(',')[1]);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

const DB = 'rotulo-biblioteca';
function idb() {
  return new Promise((ok, err) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('artes', { keyPath: 'id' });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => err(r.error);
  });
}
function tx(modo, fn) {
  return idb().then(db => new Promise((ok, err) => {
    const t = db.transaction('artes', modo), s = t.objectStore('artes');
    const req = fn(s);
    t.oncomplete = () => ok(req && req.result);
    t.onerror = () => err(t.error);
  }));
}

function reduzir(dataURL, max) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      if (k === 1) return ok({ data: dataURL, w: im.width, h: im.height });
      const [c, x] = cv(Math.round(im.width * k), Math.round(im.height * k));
      x.drawImage(im, 0, 0, c.width, c.height);
      ok({ data: c.toDataURL('image/png'), w: im.width, h: im.height });
    };
    im.src = dataURL;
  });
}

async function addArte(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const dataURL = await new Promise(ok => {
    const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(file);
  });
  const r = await reduzir(dataURL, 8192);
  const arte = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    nome: file.name,
    tipo: 'single',
    slot: r.w / r.h > 4 ? 'wrap' : 'top',   // faixa larga = tarja, resto = tampa
    data: r.data
  };
  artes.push(arte);
  try { await tx('readwrite', s => s.put(arte)); aviso.textContent = ''; }
  catch (e) { aviso.textContent = 'Nao foi possivel salvar a biblioteca neste navegador.'; }
  pintarLib();
}

}));
dropLib.addEventListener('drop', async e => {
  for (const f of e.dataTransfer.files) await addArte(f);
});

/* artes hospedadas na pasta artes/ do servidor */
function carregaImg(url) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => ok(true);
    im.onerror = () => ok(false);
    im.src = url;
  });
}
async function carregarPasta() {
  const achadas = [];
  // 1) manifesto de kits (tampa + tarja pareadas): { id, nome, tampa, tarja }
  try {
    const r = await fetch('artes/artes.json', { cache: 'no-store' });
    if (r.ok) {
      const lista = await r.json();
      if (Array.isArray(lista) && lista.length && lista[0] && lista[0].tampa) {
        lista.forEach((c, i) => achadas.push({
          id: 'srv-' + (c.id || i), servidor: true, tipo: 'kit',
          nome: c.nome || ('Kit ' + (i + 1)),
          // nome da marca — permite mais de uma marca na mesma biblioteca,
          // com um filtro na UI pra navegar entre elas (ver artes.json)
          marca: c.marca || MARCA_PADRAO,
          // miniatura leve pra galeria (não baixa nada em resolução alta à toa)
          thumb: 'artes/' + (c.thumb || c.tampa),
          // versão "display" (tamanho real de uso na textura 3D: 2048² / 4096
          // de largura) — é isso que baixa ao trocar de kit, bem mais leve que
          // o arquivo mestre. Se não existir em artes/display/, cai pro arquivo
          // original (compatibilidade com kits enviados por FTP sem essa pasta).
          dataTop: 'artes/display/' + c.tampa,
          dataWrap: 'artes/display/' + c.tarja,
          // arquivo mestre em resolução real — só usado no botão de download
          fullTop: 'artes/' + c.tampa,
          fullWrap: 'artes/' + c.tarja
        }));
        return achadas;
      }
      // formato antigo (compatibilidade): lista plana com slot avulso
      lista.forEach((a, i) => achadas.push({
        id: 'srv-' + i, servidor: true, tipo: 'single',
        nome: a.nome || a.arquivo,
        slot: a.slot === 'wrap' || /tarja|corpo/i.test(a.arquivo) ? 'wrap' : 'top',
        data: 'artes/' + a.arquivo
      }));
      return achadas;
    }
  } catch (e) { /* sem manifesto: cai na convenção de nomes */ }
  // 2) convenção tampa-01 / tarja-01: mesma numeração = mesmo kit
  const exts = ['png', 'jpg', 'jpeg', 'webp'];
  const achaUrl = async (base) => {
    for (const e of exts) {
      const url = 'artes/' + base + '.' + e;
      if (await carregaImg(url)) return url;
    }
    return null;
  };
  const achaDisplay = async (base, full) => {
    for (const e of exts) {
      const url = 'artes/display/' + base + '.' + e;
      if (await carregaImg(url)) return url;
    }
    return full; // sem versão display/: usa o arquivo cheio mesmo (mais lento, mas funciona)
  };
  let falhas = 0;
  for (let n = 1; n <= 60 && falhas < 3; n++) {
    const num = String(n).padStart(2, '0');
    const [top, wrap] = await Promise.all([achaUrl('tampa-' + num), achaUrl('tarja-' + num)]);
    if (top || wrap) {
      falhas = 0;
      if (top && wrap) {
        const [dispTop, dispWrap] = await Promise.all([achaDisplay('tampa-' + num, top), achaDisplay('tarja-' + num, wrap)]);
        achadas.push({ id: 'srv-' + num, servidor: true, tipo: 'kit', nome: 'Kit ' + num, thumb: top, dataTop: dispTop, dataWrap: dispWrap, fullTop: top, fullWrap: wrap });
      } else if (top) {
        achadas.push({ id: 'srv-top-' + num, servidor: true, tipo: 'single', nome: 'tampa-' + num, slot: 'top', data: top });
      } else {
        achadas.push({ id: 'srv-wrap-' + num, servidor: true, tipo: 'single', nome: 'tarja-' + num, slot: 'wrap', data: wrap });
      }
    } else falhas++;
  }
  return achadas;
}

if (modoCliente) {
  dropLib.style.display = 'none';
  exportar.style.display = 'none';
  ajudaLib.textContent = 'Clique numa arte para ver no pote, ou baixe pelo icone.';
  pintarLib();
  carregarPasta().then(srv => {
    if (srv.length) { artes = srv.concat(artes); pintarLib(); }
  });
} else {
  Promise.all([
    tx('readonly', s => s.getAll()).catch(() => []),
    carregarPasta()
  ]).then(([locais, srv]) => {
    artes = srv.concat(locais || []);
    pintarLib();
  });
}

exportar.addEventListener('click', async () => {
  exportar.textContent = 'Gerando…';
  let motor = '';
  try { motor = await (await fetch('three-d-stage.js')).text(); }
  catch (e) {
    aviso.textContent = 'Nao consegui ler three-d-stage.js para embutir.';
    exportar.textContent = 'Exportar HTML para o cliente';
    return;
  }
  setTimeout(() => {
    const srcs = [prevTop.src, prevWrap.src];
    const thumbs = Array.from(lib.childNodes);
    prevTop.removeAttribute('src'); prevWrap.removeAttribute('src');
    lib.replaceChildren();
    const antigo = document.getElementById('bibliotecaEmbutida');
    if (antigo) antigo.remove();
    const tag = document.createElement('script');
    tag.type = 'application/json';
    tag.id = 'bibliotecaEmbutida';
    tag.textContent = JSON.stringify({ artes: artes.filter(a => !a.servidor) });
    document.body.appendChild(tag);
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    tag.remove();
    lib.append(...thumbs);
    if (srcs[0]) prevTop.src = srcs[0];
    if (srcs[1]) prevWrap.src = srcs[1];
    // embute o motor 3D para o arquivo funcionar sozinho
    html = html.replace('<scr' + 'ipt src="three-d-stage.js"></scr' + 'ipt>',
      '<scr' + 'ipt>' + motor.split('<' + '/script').join('<\\/script') + '</scr' + 'ipt>');
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'simulador-rotulo-cliente.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    exportar.textContent = 'Exportar HTML para o cliente';
  }, 30);
});

reset.addEventListener('click', () => {
  Object.entries(slots).forEach(([which, s]) => {
    s.mat.map = s.base; s.mat.needsUpdate = true;
    s.prev.removeAttribute('src'); s.drop.classList.remove('has');
    delete store[which];
  });
  stage.requestRender();
  localStorage.setItem(KEY, JSON.stringify(store));
});
